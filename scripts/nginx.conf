upstream backend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 0;  # unlimited — handled by backend

    # Security: hide nginx version
    server_tokens off;

    # API proxy — all non-file requests go to Express
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;
        proxy_send_timeout 90;
    }

    # Internal file serving — not accessible directly
    # Express sends X-Accel-Redirect header, nginx serves the file
    location /private-files/ {
        alias /var/www/backend-api/uploads/;
        internal;  # Only accessible via X-Accel-Redirect from backend

        # Cache config for files
        open_file_cache max=1000 inactive=5m;
        open_file_cache_valid 2m;
        open_file_cache_min_uses 1;

        # Browser cache headers for static files
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Optional: monitor nginx status
    location /nginx-status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
